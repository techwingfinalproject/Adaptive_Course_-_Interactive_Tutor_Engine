<div class="not-found-container animate-fade-in">
  <div class="card not-found-card">
    <div class="not-found-illustration">
      <!-- 404 SVG Illustration -->
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" width="150" height="150">
        <circle cx="100" cy="100" r="80" fill="var(--color-primary-light)" />
        <!-- Broken chain / page -->
        <rect x="70" y="60" width="60" height="80" rx="6" fill="#FFFFFF" stroke="var(--color-primary)" stroke-width="4" />
        <line x1="80" y1="80" x2="120" y2="80" stroke="var(--color-secondary)" stroke-width="4" stroke-linecap="round" />
        <line x1="80" y1="100" x2="110" y2="100" stroke="var(--color-secondary)" stroke-width="4" stroke-linecap="round" />
        <line x1="80" y1="120" x2="100" y2="120" stroke="var(--color-secondary)" stroke-width="4" stroke-linecap="round" />
        <!-- Red warning triangle -->
        <polygon points="140,140 170,140 155,110" fill="var(--color-error)" />
        <text x="155" y="135" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">!</text>
      </svg>
    </div>
    
    <h2>404 - Page Not Found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    
    <a routerLink="/dashboard" class="btn btn-primary mt-md">
      Back to Dashboard
    </a>
  </div>
</div>
